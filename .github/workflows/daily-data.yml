name: Daily market data feed

on:
  schedule:
    # 10:15 UTC = 5:15 AM Central (CDT) / 4:15 AM (CST), every day; the 6 AM dashboard job reads the result.
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (all sources) or intraday (5-minute snapshot of the core tickers)"
        required: false
        default: "daily"
  push:
    branches: [main, master]
    paths:
      - "fetch/**"
      - "config.json"
      - ".github/workflows/daily-data.yml"

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r fetch/requirements.txt

      - name: Fetch all sources
        timeout-minutes: 28
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          if [ "$MODE" = "intraday" ]; then python fetch/fetch_data.py intraday; else python fetch/fetch_data.py; fi

      - name: Commit data
        if: always()
        env:
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          if [ "$MODE" = "intraday" ]; then
            # write each snapshot file through the contents API: no local git state, no push races
            for f in data/intraday/*; do
              [ -f "$f" ] || continue
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$f?ref=${GITHUB_REF_NAME}" -q .sha 2>/dev/null || true)
              b64=$(base64 -w0 "$f")
              if [ -n "$sha" ]; then
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$f" -f message="intraday: $f $(date -u +%H:%MZ)" -f content="$b64" -f sha="$sha" -f branch="${GITHUB_REF_NAME}" >/dev/null
              else
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$f" -f message="intraday: $f $(date -u +%H:%MZ)" -f content="$b64" -f branch="${GITHUB_REF_NAME}" >/dev/null
              fi
            done
            exit 0
          fi
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data ($MODE): $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; git reset --soft "origin/${GITHUB_REF_NAME}"; git commit -m "data ($MODE): $(date -u +%Y-%m-%dT%H:%MZ)"; }
            sleep 5
          done
          exit 1
