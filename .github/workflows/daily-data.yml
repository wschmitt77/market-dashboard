name: Daily market data feed

on:
  schedule:
    # 10:15 UTC = 5:15 AM Central (CDT) / 4:15 AM (CST), every day; the 6 AM dashboard job reads the result.
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (all sources) or intraday (5-minute snapshot of the core tickers)"
        required: false
        default: "daily"
  push:
    branches: [main, master]
    paths:
      - "fetch/**"
      - "config.json"
      - ".github/workflows/daily-data.yml"

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r fetch/requirements.txt

      - name: Fetch all sources
        timeout-minutes: 28
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          if [ "$MODE" = "intraday" ]; then python fetch/fetch_data.py intraday; else python fetch/fetch_data.py; fi

      - name: Commit data
        if: always()
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
